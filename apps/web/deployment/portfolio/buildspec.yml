version: 0.2
env:
  shell: bash
phases:
  install:
    commands:
      - |
        set -euo pipefail
        mkdir -p evidence/frontend-image
        [[ "${EXPECTED_SHA:-}" =~ ^[0-9a-f]{40}$ ]]
        test "$(cat source-commit.txt)" = "$EXPECTED_SHA"
        test -n "${EXPECTED_S3_VERSION:-}"
        test "$CODEBUILD_SOURCE_VERSION" = "$EXPECTED_S3_VERSION"
        test "$(uname -m)" = aarch64
        case "$(docker info --format '{{.Architecture}}')" in aarch64|arm64) ;; *) exit 1 ;; esac
        printf 'commit=%s\nsourceVersion=%s\n' "$EXPECTED_SHA" "$CODEBUILD_SOURCE_VERSION" | tee evidence/frontend-image/source.txt
  build:
    commands:
      - |
        set -euo pipefail
        (
          set -euo pipefail
          docker build --pull --platform linux/arm64 -f apps/web/Dockerfile -t "$REPOSITORY_URI:$EXPECTED_SHA" .
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$REPOSITORY_URI:$EXPECTED_SHA")" = linux/arm64
          bash apps/web/deployment/portfolio/smoke.sh "$REPOSITORY_URI:$EXPECTED_SHA"
        ) 2>&1 | tee evidence/frontend-image/build-smoke.log
        printf '0\n' > evidence/frontend-image/build-smoke-exit.txt
  post_build:
    commands:
      - |
        set -euo pipefail
        test "${CODEBUILD_BUILD_SUCCEEDING:-0}" = 1
        test "$(cat evidence/frontend-image/build-smoke-exit.txt)" = 0
        aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "${REPOSITORY_URI%%/*}"
        docker push "$REPOSITORY_URI:$EXPECTED_SHA"
        aws ecr describe-images --repository-name capiro/portfolio-preview --image-ids "imageTag=$EXPECTED_SHA" --query 'imageDetails[0].{imageDigest:imageDigest,imageTags:imageTags,imageScanStatus:imageScanStatus}' --output json | tee evidence/frontend-image/image.json
