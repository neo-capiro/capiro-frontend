AWSTemplateFormatVersion: "2010-09-09"
Description: Isolated ECS/ALB network for the Capiro Portfolio preview frontend

Parameters:
  ImageUri:
    Type: String
    Description: Exact ECR image URI including sha256 digest
    AllowedPattern: "^[0-9]{12}\\.dkr\\.ecr\\.us-east-1\\.amazonaws\\.com/capiro/portfolio-preview@sha256:[0-9a-f]{64}$"
  CertificateArn:
    Type: String
    Description: ISSUED ACM certificate for portfolio-preview.app.capiro.ai
  AllowedIngressCidr:
    Type: String
    Description: Approved browser source IPv4 /32
    AllowedPattern: "^(?:[0-9]{1,3}\\.){3}[0-9]{1,3}/32$"
  ClerkPublishableKeySecretArn:
    Type: String
    Description: Owner-confirmed existing Clerk publishable-key reference; payload and issuer pairing remain held
    AllowedPattern: "^arn:aws:secretsmanager:us-east-1:967807252336:secret:/capiro/dev/clerk/publishable-key-rAfesC$"
  ClerkSecretKeySecretArn:
    Type: String
    Description: Owner-confirmed existing Clerk secret-key reference; payload and issuer pairing remain held
    AllowedPattern: "^arn:aws:secretsmanager:us-east-1:967807252336:secret:/capiro/dev/clerk/secret-key-FT67tM$"
  ClerkKmsKeyArn:
    Type: String
    Description: KMS key ARN protecting the two designated Clerk secrets
    AllowedPattern: "^arn:aws:kms:us-east-1:967807252336:key/f47b4c53-b9c0-4d91-ad57-4d882f87767e$"
  TrackerBackend:
    Type: String
    AllowedValues: ["intelligence"]
    Description: Explicit owner of Bill Tracker requests
  CoreApiBaseUrl:
    Type: String
    Default: https://portfolio-preview.app.capiro.ai/api
    AllowedValues: ["https://portfolio-preview.app.capiro.ai/api"]
  StrategyApiBaseUrl:
    Type: String
    Default: ""
    AllowedValues: [""]
  WorkspaceApiBaseUrl:
    Type: String
    Default: https://portfolio-preview.app.capiro.ai/workspace-api
    AllowedValues: ["https://portfolio-preview.app.capiro.ai/workspace-api"]
  IntelligenceApiBaseUrl:
    Type: String
    Default: https://portfolio-preview.app.capiro.ai/intel-api
    AllowedValues: ["https://portfolio-preview.app.capiro.ai/intel-api"]
  ExistingAppUrl:
    Type: String
    Default: https://portfolio-preview.app.capiro.ai
    AllowedValues: ["https://portfolio-preview.app.capiro.ai"]
  CapiroRequestOrigin:
    Type: String
    Default: https://portfolio-preview.app.capiro.ai
    AllowedValues: ["https://portfolio-preview.app.capiro.ai"]
  CapiroPreviewReadOnly:
    Type: String
    Default: "true"
    AllowedValues: ["true"]
    Description: Keep ordinary backend routes held; only exact reviewed exceptions can pass
  CapiroPreviewReadBackendSource:
    Type: String
    Default: ""
    AllowedValues: ["", "6542f5b089656b6d255465edd464d06c2a0b408f"]
  CapiroPreviewReadApiBaseUrl:
    Type: String
    Default: ""
    AllowedValues: ["", "https://first-chat-preview.app-dev.capiro.ai/api"]
  MeriFirstChatBootstrapEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["false", "true"]
  MeriFirstChatClientId:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    Description: Exact owner-verified active client; no value is committed in source
  CapiroPreviewFirstChatBackendSource:
    Type: String
    Default: ""
    AllowedValues: ["", "c64f0005cf14d69683aabafa11def4964d766832"]
  CapiroPreviewFirstChatApiBaseUrl:
    Type: String
    Default: ""
    AllowedValues: ["", "https://first-chat-preview.app-dev.capiro.ai/api"]
  MeriApiBaseUrl:
    Type: String
    Default: ""
    MaxLength: 512
    AllowedPattern: "^$|^https://[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)*\\.[a-z](?:[a-z0-9-]{0,61}[a-z0-9])?$"
    Description: Explicit HTTPS root origin for a separately qualified Meri service; empty keeps conversation held
  MeriConversationWorkflowEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["false", "true"]
    Description: Explicit Meri conversation opt-in after the service and its dependencies are qualified
  CapiroPreviewMeriConversationRoutesEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["false", "true"]
  CapiroPreviewMeriRuntimeOrigin:
    Type: String
    Default: ""
    MaxLength: 512
    AllowedPattern: "^$|^https://[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)*\\.[a-z](?:[a-z0-9-]{0,61}[a-z0-9])?$"
  CapiroPreviewMeriRuntimeSource:
    Type: String
    Default: ""
    AllowedValues: ["", "f005f77316bb8735e60f16c3ac99a5c8e3d71a34"]
  CapiroPreviewMeriRuntimeImageDigest:
    Type: String
    Default: ""
    AllowedValues: ["", "sha256:6a03d5367c22a95db1fbc95a08b2bb1237164bfdf3b6f215f076a38833fffb8d"]
  CapiroPreviewMeriContractPackageVersion:
    Type: String
    Default: ""
    AllowedValues: ["", "0.1.8"]
    Description: Frontend consumer distribution; this is not a Meri producer package assertion

Rules:
  PreviewReadRequiresPairedTarget:
    RuleCondition: !Equals [!Ref CapiroPreviewReadBackendSource, "6542f5b089656b6d255465edd464d06c2a0b408f"]
    Assertions:
      - Assert: !Equals [!Ref CapiroPreviewReadApiBaseUrl, "https://first-chat-preview.app-dev.capiro.ai/api"]
        AssertDescription: Reviewed Core read source requires its exact preview API target
  PreviewReadHeldWithoutSource:
    RuleCondition: !Equals [!Ref CapiroPreviewReadBackendSource, ""]
    Assertions:
      - Assert: !Equals [!Ref CapiroPreviewReadApiBaseUrl, ""]
        AssertDescription: A Core read target cannot be staged without the reviewed source
  FirstChatRequiresCurrentBindings:
    RuleCondition: !Equals [!Ref MeriFirstChatBootstrapEnabled, "true"]
    Assertions:
      - Assert: !Not [!Equals [!Ref MeriFirstChatClientId, ""]]
        AssertDescription: First chat requires one owner-verified active client
      - Assert: !Equals [!Ref CapiroPreviewReadBackendSource, "6542f5b089656b6d255465edd464d06c2a0b408f"]
        AssertDescription: First chat needs the selected-client read binding
      - Assert: !Equals [!Ref CapiroPreviewFirstChatBackendSource, "c64f0005cf14d69683aabafa11def4964d766832"]
        AssertDescription: First chat requires its reviewed Core bootstrap source
      - Assert: !Equals [!Ref CapiroPreviewFirstChatApiBaseUrl, "https://first-chat-preview.app-dev.capiro.ai/api"]
        AssertDescription: First chat requires the fixed Core preview API target
      - Assert: !Equals [!Ref CapiroPreviewMeriConversationRoutesEnabled, "true"]
        AssertDescription: First chat requires the separately qualified Meri route
  FirstChatHeldWithoutFlag:
    RuleCondition: !Equals [!Ref MeriFirstChatBootstrapEnabled, "false"]
    Assertions:
      - Assert: !Equals [!Ref MeriFirstChatClientId, ""]
        AssertDescription: A held first-chat route must not carry a client identifier
      - Assert: !Equals [!Ref CapiroPreviewFirstChatBackendSource, ""]
        AssertDescription: A held first-chat route must not carry a source marker
      - Assert: !Equals [!Ref CapiroPreviewFirstChatApiBaseUrl, ""]
        AssertDescription: A held first-chat route must not carry a target
  MeriConversationRequiresOrigin:
    RuleCondition: !Equals [!Ref MeriConversationWorkflowEnabled, "true"]
    Assertions:
      - Assert: !Not [!Equals [!Ref MeriApiBaseUrl, ""]]
        AssertDescription: Meri conversation opt-in requires an HTTPS Meri root origin
      - Assert: !Equals [!Ref CapiroPreviewMeriConversationRoutesEnabled, "true"]
        AssertDescription: Meri workflow opt-in requires its narrow preview route
      - Assert: !Equals [!Ref CapiroPreviewMeriRuntimeOrigin, !Ref MeriApiBaseUrl]
        AssertDescription: Meri runtime origin must equal the configured Meri API origin
      - Assert: !Equals [!Ref CapiroPreviewMeriRuntimeSource, "f005f77316bb8735e60f16c3ac99a5c8e3d71a34"]
        AssertDescription: Meri route requires the currently qualified image source
      - Assert: !Equals [!Ref CapiroPreviewMeriRuntimeImageDigest, "sha256:6a03d5367c22a95db1fbc95a08b2bb1237164bfdf3b6f215f076a38833fffb8d"]
        AssertDescription: Meri route requires the currently qualified image digest
      - Assert: !Equals [!Ref CapiroPreviewMeriContractPackageVersion, "0.1.8"]
        AssertDescription: Meri route requires the frontend consumer distribution version
  MeriRouteHeldWithoutWorkflow:
    RuleCondition: !Equals [!Ref MeriConversationWorkflowEnabled, "false"]
    Assertions:
      - Assert: !Equals [!Ref CapiroPreviewMeriConversationRoutesEnabled, "false"]
        AssertDescription: Held Meri workflow cannot open conversation routes
      - Assert: !Equals [!Ref CapiroPreviewMeriRuntimeOrigin, ""]
        AssertDescription: Held Meri route must not carry a runtime origin
      - Assert: !Equals [!Ref CapiroPreviewMeriRuntimeSource, ""]
        AssertDescription: Held Meri route must not carry an image source
      - Assert: !Equals [!Ref CapiroPreviewMeriRuntimeImageDigest, ""]
        AssertDescription: Held Meri route must not carry an image digest
      - Assert: !Equals [!Ref CapiroPreviewMeriContractPackageVersion, ""]
        AssertDescription: Held Meri route must not carry a consumer version

Resources:
  PreviewVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.90.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: capiro-portfolio-preview
        - Key: Environment
          Value: portfolio-preview
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref PreviewVpc
      InternetGatewayId: !Ref InternetGateway
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref PreviewVpc
      CidrBlock: 10.90.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: capiro-portfolio-preview-a
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref PreviewVpc
      CidrBlock: 10.90.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: capiro-portfolio-preview-b
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref PreviewVpc
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnetARoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable
  PublicSubnetBRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Approved browser HTTPS ingress for Portfolio preview
      VpcId: !Ref PreviewVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref AllowedIngressCidr
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 5188
          ToPort: 5188
          CidrIp: 10.90.0.0/16
  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Portfolio task ingress only from its preview ALB
      VpcId: !Ref PreviewVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5188
          ToPort: 5188
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
  PreviewAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      SecurityGroups: [!Ref AlbSecurityGroup]
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
  PreviewTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref PreviewVpc
      TargetType: ip
      Protocol: HTTP
      Port: 5188
      HealthCheckEnabled: true
      HealthCheckPath: /healthz
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: "200"
  PreviewListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref PreviewAlb
      Protocol: HTTPS
      Port: 443
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref PreviewTargetGroup
  PreviewCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: capiro-portfolio-preview
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
  PreviewLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /capiro/portfolio-preview
      RetentionInDays: 14
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: portfolio-preview-bootstrap
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/capiro/portfolio-preview
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/capiro/portfolio-preview:log-stream:*
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref ClerkPublishableKeySecretArn
                  - !Ref ClerkSecretKeySecretArn
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !Ref ClerkKmsKeyArn
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub secretsmanager.${AWS::Region}.amazonaws.com
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
  PreviewTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: capiro-portfolio-preview
      Cpu: "512"
      Memory: "1024"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: portfolio-web
          Essential: true
          Image: !Ref ImageUri
          PortMappings:
            - ContainerPort: 5188
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref PreviewLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: portfolio
          Secrets:
            - Name: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
              ValueFrom: !Ref ClerkPublishableKeySecretArn
            - Name: CLERK_SECRET_KEY
              ValueFrom: !Ref ClerkSecretKeySecretArn
          Environment:
            - Name: CORE_API_BASE_URL
              Value: !Ref CoreApiBaseUrl
            - Name: STRATEGY_API_BASE_URL
              Value: !Ref StrategyApiBaseUrl
            - Name: WORKSPACE_API_BASE_URL
              Value: !Ref WorkspaceApiBaseUrl
            - Name: INTELLIGENCE_API_BASE_URL
              Value: !Ref IntelligenceApiBaseUrl
            - Name: CAPIRO_EXISTING_APP_URL
              Value: !Ref ExistingAppUrl
            - Name: CAPIRO_REQUEST_ORIGIN
              Value: !Ref CapiroRequestOrigin
            - Name: CAPIRO_PREVIEW_READ_ONLY
              Value: !Ref CapiroPreviewReadOnly
            - Name: CAPIRO_PREVIEW_READ_BACKEND_SOURCE
              Value: !Ref CapiroPreviewReadBackendSource
            - Name: CAPIRO_PREVIEW_READ_API_BASE_URL
              Value: !Ref CapiroPreviewReadApiBaseUrl
            - Name: MERI_FIRST_CHAT_BOOTSTRAP_ENABLED
              Value: !Ref MeriFirstChatBootstrapEnabled
            - Name: MERI_FIRST_CHAT_CLIENT_ID
              Value: !Ref MeriFirstChatClientId
            - Name: CAPIRO_PREVIEW_FIRST_CHAT_BACKEND_SOURCE
              Value: !Ref CapiroPreviewFirstChatBackendSource
            - Name: CAPIRO_PREVIEW_FIRST_CHAT_API_BASE_URL
              Value: !Ref CapiroPreviewFirstChatApiBaseUrl
            - Name: TRACKER_BACKEND
              Value: !Ref TrackerBackend
            - Name: ONBOARD_API_BASE_URL
              Value: ""
            - Name: MERI_API_BASE_URL
              Value: !Ref MeriApiBaseUrl
            - Name: MERI_CONVERSATION_WORKFLOW_ENABLED
              Value: !Ref MeriConversationWorkflowEnabled
            - Name: CAPIRO_PREVIEW_MERI_CONVERSATION_ROUTES_ENABLED
              Value: !Ref CapiroPreviewMeriConversationRoutesEnabled
            - Name: CAPIRO_PREVIEW_MERI_RUNTIME_ORIGIN
              Value: !Ref CapiroPreviewMeriRuntimeOrigin
            - Name: CAPIRO_PREVIEW_MERI_RUNTIME_SOURCE
              Value: !Ref CapiroPreviewMeriRuntimeSource
            - Name: CAPIRO_PREVIEW_MERI_RUNTIME_IMAGE_DIGEST
              Value: !Ref CapiroPreviewMeriRuntimeImageDigest
            - Name: CAPIRO_PREVIEW_MERI_CONTRACT_PACKAGE_VERSION
              Value: !Ref CapiroPreviewMeriContractPackageVersion
            - Name: MERI_ACTION_WORKFLOW_ENABLED
              Value: "false"
            - Name: MERI_DOCUMENT_WORKFLOW_ENABLED
              Value: "false"
            - Name: MERI_DOCUMENT_OPERATION
              Value: ""
  PreviewService:
    Type: AWS::ECS::Service
    DependsOn: PreviewListener
    Properties:
      Cluster: !Ref PreviewCluster
      ServiceName: capiro-portfolio-preview
      TaskDefinition: !Ref PreviewTaskDefinition
      LaunchType: FARGATE
      DesiredCount: 1
      HealthCheckGracePeriodSeconds: 90
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      LoadBalancers:
        - ContainerName: portfolio-web
          ContainerPort: 5188
          TargetGroupArn: !Ref PreviewTargetGroup
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups: [!Ref TaskSecurityGroup]
          Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
  UnhealthyTargetAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Portfolio preview has an unhealthy registered target
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt PreviewAlb.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt PreviewTargetGroup.TargetGroupFullName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: missing

Outputs:
  AlbDnsName:
    Value: !GetAtt PreviewAlb.DNSName
  AlbHostedZoneId:
    Value: !GetAtt PreviewAlb.CanonicalHostedZoneID
  ServiceArn:
    Value: !Ref PreviewService
  VpcId:
    Value: !Ref PreviewVpc
  TargetGroupArn:
    Value: !Ref PreviewTargetGroup
