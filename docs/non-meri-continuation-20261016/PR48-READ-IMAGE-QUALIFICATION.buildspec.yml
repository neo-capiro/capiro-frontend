# One-shot PR48 read-source and existing-Clerk preview configuration successor.
# Use only with a reviewed frontend source commit whose only product change from
# e0b47a34 is the read-source marker. The deployment metadata/template change
# is verified by the focused preview-config suite. Prior broad browser evidence
# remains at its recorded source pins; this does not claim to rerun it.
version: 0.2
env:
  shell: bash
phases:
  install:
    runtime-versions:
      nodejs: 24
    commands:
      - set -euo pipefail
      - node --version
      - npm --version
      - npm ci --ignore-scripts --no-audit --no-fund
      - npm exec --workspace @capiro/web -- playwright install --with-deps chromium
  build:
    commands:
      - set -euo pipefail
      - test -n "${EXPECTED_SHA:-}"
      - test "$(cat source-commit.txt)" = "$EXPECTED_SHA"
      - test "$CODEBUILD_SOURCE_VERSION" = "$EXPECTED_S3_VERSION"
      - node --test scripts/preview-config.test.mjs
      - npm exec --workspace @capiro/web -- vitest run tests/preview-read-receiving.test.ts
      - npm run typecheck --workspace @capiro/web
      - npm run build
      - npm run test:production
      - docker build --pull --platform linux/amd64 -f apps/web/Dockerfile -t "$REPOSITORY_URI:$EXPECTED_SHA" .
      - bash apps/web/deployment/portfolio/smoke.sh "$REPOSITORY_URI:$EXPECTED_SHA"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "${REPOSITORY_URI%%/*}"
      - docker push "$REPOSITORY_URI:$EXPECTED_SHA"
      - aws ecr describe-images --repository-name capiro/portfolio-preview --image-ids "imageTag=$EXPECTED_SHA" --query 'imageDetails[0].{imageDigest:imageDigest,imageTags:imageTags,imageScanStatus:imageScanStatus}' --output json
